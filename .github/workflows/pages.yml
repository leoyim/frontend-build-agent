name: Deploy to GitHub Pages

# 部署的是 public/ 这一个目录：它就是完整的静态站点，
# 页面加载后探测不到 /api，会自动切到浏览器内的 client-backend.js。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推上去就取消排队中的旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 语料改过却忘了重新生成 knowledge.json 的话，站点会用旧资料作答，
      # 而且页面上不会有任何异常 —— 这条检查就是为了拦住这种静默过期。
      - name: 语料生成物必须是最新的
        run: |
          node tools/build-knowledge.js
          if ! git diff --exit-code -- public/knowledge.json; then
            echo "::error::knowledge/ 里改过内容，但 public/knowledge.json 没有重新生成。请本地运行 npm run build:knowledge 并提交产物。"
            exit 1
          fi

      - name: 静态站点自检
        run: |
          test -f public/index.html
          test -f public/core.js
          test -f public/client-backend.js
          test -f public/knowledge.json
          echo "public/ 文件齐备：$(ls public | tr '\n' ' ')"

      # CNAME 丢了不会报错，只会让站点悄悄退回 leoyim.github.io/<repo> 的地址，
      # 而且自定义域名的 HTTPS 证书也会跟着失效。所以在这里挡一道。
      - name: 自定义域名声明必须在
        run: |
          test -f public/CNAME || { echo "::error::public/CNAME 缺失，站点会退回默认地址"; exit 1; }
          echo "CNAME: $(cat public/CNAME)"

      # 相对路径是子路径部署的前提。绝对路径（以 / 开头）在本部署形态下
      # 会指向域名根而不是应用目录，页面能开、但样式和脚本会 404。
      - name: 静态资源必须用相对路径
        run: |
          if grep -nE '(src|href)="/' public/index.html; then
            echo "::error::public/index.html 里出现以 / 开头的绝对路径，子路径下会 404"
            exit 1
          fi
          echo "资源引用均为相对路径"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
